# proposed -- spend the same 25 structures on MSA diversity instead.
#
# Five depth-varied subsamples of the SAME MSA the baseline receives, five
# diffusion samples each. Variant 0 is the full alignment, so this arm's input
# set contains the baseline's input rather than replacing it.

run_id: proposed-boltz2-rnp
arm: proposed
budget: 25

n_msa_variants: 5
n_dock_poses: 0

n_systems:
  sanity: 3
  pilot: 20
  full: null

workers: 4
pose_matrix: true

# Sharding. The orchestrator kills long runs -- and on BYO Slurm a killed run's
# outputs are never collected, so its work is simply gone. Splitting the
# population into shards that each finish in well under two hours is what makes
# progress durable. Override on the command line: run.shard_index / shard_count.
shard_index: 0
shard_count: 1
